name: University Watcher
on:
  workflow_dispatch:
  repository_dispatch:
    types: [university_watcher]

permissions:
  contents: write

concurrency:
  group: university-watcher
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install -r university_watcher/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scan annonces et envoyer les alertes
        id: scan
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python university_watcher/watcher.py
      - name: Sauvegarder seulement l'historique universitaire
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add university_watcher/seen_university_jobs.json university_watcher/analysed_university_jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update university watcher seen jobs"
            git pull --rebase
            git push
          fi
      - name: Vérifier le statut de la collecte
        if: steps.scan.outcome == 'failure'
        run: exit 1
