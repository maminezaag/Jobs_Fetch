name: stat_jobs

# Lancement MANUEL uniquement (Actions -> stat_jobs -> Run workflow).
# Indépendant de job_watcher.yml.
on:
  workflow_dispatch:

jobs:
  stat-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances de stat_jobs
        run: pip install -r stat_jobs/requirements.txt

      - name: Lancer stat_jobs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          STAT_JOBS_SHEET_ID: ${{ secrets.STAT_JOBS_SHEET_ID }}
        run: python stat_jobs/stat_jobs.py

      # Copie des résultats (JSON + CSV) : secours si l'écriture dans le Sheet échoue
      - name: Sauvegarder les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stat-jobs-out
          path: stat_jobs/out/
          if-no-files-found: ignore
