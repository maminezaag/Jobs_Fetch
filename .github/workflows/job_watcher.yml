# =============================================================================
# .github/workflows/job_watcher.yml
# =============================================================================
# Lance les deux collecteurs (IT et Bochra), puis sauvegarde leurs historiques.
# Le déclenchement reste externe (repository_dispatch / crontab.org) ou manuel.
# Correction : si un autre workflow (ex. stat_jobs) pousse sur main pendant
# la collecte, on récupère ses commits avant de pousser les historiques.

name: Job Watcher

on:
  repository_dispatch:
    types: [run-job-watcher]
  workflow_dispatch: {}

permissions:
  contents: write

# Empêche deux exécutions de Job Watcher d'écrire simultanément les mêmes états.
# N'annule jamais une exécution en cours. Les autres workflows (stat_jobs)
# continuent de fonctionner indépendamment.
concurrency:
  group: job-watcher-main
  cancel-in-progress: false

jobs:
  run-job-watcher:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer job_watcher.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python job_watcher.py --config config.yaml

      - name: Lancer job_watcher_bochra.py
        # Continuer si le script IT a échoué, sauf annulation explicite.
        if: ${{ !cancelled() }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python job_watcher_bochra.py --config config_bochra.yaml

      - name: Sauvegarder les historiques seen_jobs*.json
        # Sauvegarder même si un collecteur a échoué, sauf annulation.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "job-watcher-bot"
          git config user.email "job-watcher-bot@users.noreply.github.com"

          # Uniquement les deux historiques, jamais les archives de stat_jobs.
          git add -- 'seen_jobs*.json'
          if git diff --cached --quiet; then
            echo "Aucun historique modifié : rien à pousser."
            exit 0
          fi

          git commit -m "chore: mise à jour de l'historique des offres vues [skip ci]"

          # Un workflow indépendant peut modifier main pendant les recherches.
          # Rebase sur le dernier main, puis retry si une nouvelle mise à jour
          # arrive entre fetch et push. Pas de push --force.
          for tentative in 1 2 3 4 5; do
            echo "Synchronisation Git (tentative ${tentative}/5)..."
            git fetch --no-tags origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Conflit Git sur les mêmes fichiers : sauvegarde interrompue pour éviter une perte de données." >&2
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Historiques sauvegardés sur GitHub."
              exit 0
            fi

            echo "La branche main a changé entre fetch et push : nouvelle tentative..."
            sleep $((tentative * 3))
          done

          echo "Échec du push après 5 tentatives. Aucun push forcé." >&2
          exit 1
